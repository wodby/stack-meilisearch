name: meilisearch
title: Meilisearch
icon: meilisearch
docs: https://wodby.com/docs/2.0/stacks/catalog/meilisearch/

services:
- name: meilisearch
  title: Meilisearch
  service: meilisearch
  required: true
  main: true
  volumes:
  - name: data
    size: 10
  workloads:
  - name: main
    containers:
    - name: meilisearch
      resources:
        request:
          cpu: 200
          memory: 512
        limit:
          cpu: 2000
          memory: 2048
